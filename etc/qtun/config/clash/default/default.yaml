mixed-port: 7890
redir-port: 7892

allow-lan: true
bind-address: "*"

mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090
external-ui: ./ui
secret: ""

unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: system
  device: tun-qtun
  auto-route: true
  strict-route: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
  force-dns-mapping: false
  parse-pure-ip: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "pool.ntp.org"

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 223.5.5.5

  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
    - 8.8.8.8

  proxy-server-nameserver:
    - 8.8.8.8

  fallback:
    - https://1.1.1.1/dns-query
    - 9.9.9.9

  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4